# ============================================================================
# One Dark
# ============================================================================
# Loaded by tmux.conf via `@theme`. This file owns every visual setting;
# tmux.conf owns behaviour. Keep that split — a theme should be swappable by
# changing one line and hitting prefix-r.
#
# Palette matches config/alacritty/themes/one_dark_pro.toml. The three shades
# below the terminal colours (bg_alt, surface, grey) aren't part of a 16-colour
# terminal palette but One Dark Pro uses them for chrome, so they're here too.

# ============================================================================
# Palette
# ============================================================================
set -g @od_bg      "#282c34"  # editor background
set -g @od_bg_alt  "#21252b"  # sidebar — darker, used for the status bar
set -g @od_surface "#2c313a"  # cursorline — inactive pane borders
set -g @od_fg      "#abb2bf"
set -g @od_grey    "#5c6370"  # comments — separators, inactive windows

set -g @od_red     "#e06c75"
set -g @od_green   "#98c379"
set -g @od_yellow  "#e5c07b"
set -g @od_orange  "#d19a66"
set -g @od_blue    "#61afef"
set -g @od_magenta "#c678dd"
set -g @od_cyan    "#56b6c2"

# ============================================================================
# Status Bar
# ============================================================================
set -g status-style "fg=#{@od_fg},bg=#{@od_bg_alt}"
set -g status-left ""

# Windows sit on the left (status-left is empty). Current window is a solid
# blue block; the rest are grey on the bar background.
set -g window-status-separator ""
set -g window-status-format "#[fg=#{@od_grey},bg=#{@od_bg_alt}] #I #W#{?window_zoomed_flag, [Z],} "
set -g window-status-current-format "#[fg=#{@od_bg},bg=#{@od_blue},bold] #I #W#{?window_zoomed_flag, [Z],} "
set -g window-status-activity-style "fg=#{@od_yellow},bg=#{@od_bg_alt}"
set -g window-status-bell-style "fg=#{@od_red},bg=#{@od_bg_alt},bold"

# session │ host │ date time
set -g status-right "#[fg=#{@od_magenta}]#{?client_prefix,#[reverse],} #S #[none]"
set -ag status-right "#[fg=#{@od_grey}]│#[fg=#{@od_green}] #h "
set -agF status-right "#[fg=#{@od_grey}]│#[fg=#{@od_blue}] %Y-%m-%d %H:%M "

# ============================================================================
# Panes
# ============================================================================
set -g pane-border-style "fg=#{@od_surface}"
set -g pane-active-border-style "fg=#{@od_blue}"

# colour-type options (as opposed to style-type) are parsed at set time and
# never format-expanded, so #{@od_*} would be silently dropped — literal only.
set -g display-panes-colour "#5c6370"
set -g display-panes-active-colour "#61afef"

# ============================================================================
# Messages, Copy Mode, Clock
# ============================================================================
set -g message-style "fg=#{@od_bg},bg=#{@od_yellow},bold"
set -g message-command-style "fg=#{@od_bg},bg=#{@od_orange},bold"
set -g mode-style "fg=#{@od_bg},bg=#{@od_blue}"
set -g copy-mode-match-style "fg=#{@od_bg},bg=#{@od_yellow}"
set -g copy-mode-current-match-style "fg=#{@od_bg},bg=#{@od_orange}"
set -g clock-mode-colour "#61afef"  # colour-type — see note above
