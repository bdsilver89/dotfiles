name: ci

on:
  push:
    branches: [main, chezmoi-rewrite]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_ANALYTICS: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1
  # chezmoi keys --promptString by the prompt TEXT, not the data key. These
  # must match home/.chezmoi.toml.tmpl and bootstrap.sh verbatim.
  P_ROLE: "Machine role (desktop/headless)"
  P_THEME: "Colour scheme"
  P_EMAIL: "Git email"
  P_WORK: "Is this a work machine?"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # gitleaks needs history, not just the tip
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Templates are excluded: shellcheck cannot parse `{{`. They are linted
      # in `render`, after chezmoi has rendered them.
      - name: shellcheck
        run: |
          shellcheck --shell=sh \
            bootstrap.sh \
            home/dot_profile \
            home/dot_config/sh/00-path.sh \
            home/dot_config/sh/20-aliases.sh \
            home/dot_config/sh/30-tools.sh \
            home/dot_claude/executable_statusline-command.sh \
            home/dot_local/bin/executable_theme
          shellcheck --shell=bash \
            home/dot_bashrc \
            home/dot_local/bin/executable_tmux-sessionizer \
            home/dot_local/bin/executable_tmux-windowizer

      # chezmoi keys --promptString/--promptBool by the prompt TEXT, so the
      # literals in the config template and in its three callers have to stay
      # byte-identical. Drift is silent: the flag simply stops matching and the
      # prompt falls back to its default, which on a --no-tty run means a
      # machine quietly configured wrong. Comments alone never caught this.
      - name: prompt strings match across bootstrap and CI
        run: |
          set -uo pipefail
          prompts="$(sed -nE \
            's/.*prompt(String|Bool)Once[^"]*"[^"]*"[[:space:]]*"([^"]*)".*/\2/p' \
            home/.chezmoi.toml.tmpl)"
          [ -n "$prompts" ] || { echo "::error::no prompts found - extraction broke"; exit 1; }

          fail=0
          # A `... | while` pipeline would run the loop in a subshell and throw
          # the fail flag away, so feed the loop with a here-string instead.
          while IFS= read -r p; do
            for f in bootstrap.sh bootstrap.ps1 .github/workflows/ci.yml; do
              grep -qF -- "$p" "$f" \
                || { echo "::error file=$f::prompt \"$p\" from .chezmoi.toml.tmpl is missing here"; fail=1; }
            done
          done <<< "$prompts"
          exit $fail

  render:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Only the ubuntu image ships shellcheck. macOS needs it too: the darwin
      # branches of the run_onchange templates render nowhere else, so skipping
      # it here would leave them permanently unlinted.
      - name: install shellcheck
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: render every combination, twice
        run: |
          set -uo pipefail
          fail=0
          for role in desktop headless; do
            for work in true false; do
              for theme in onedark catppuccin-mocha dracula rose-pine; do
                tag="$role-$work-$theme"
                cfg="$RUNNER_TEMP/$tag.toml"

                # --config-path keeps every combination independent. Writing to
                # the real ~/.config/chezmoi/chezmoi.toml would poison the loop:
                # promptStringOnce reuses a value already present in the config,
                # so iteration 2 onward would silently re-render iteration 1.
                chezmoi init --config-path="$cfg" --source="$PWD" \
                  --no-tty --force \
                  --promptString "$P_ROLE=$role" \
                  --promptString "$P_THEME=$theme" \
                  --promptString "$P_EMAIL=ci@example.com" \
                  --promptBool "$P_WORK=$work" \
                  || { echo "::error::init failed: $tag"; fail=1; continue; }

                for pass in a b; do
                  out="$RUNNER_TEMP/$tag-$pass"; mkdir -p "$out"
                  chezmoi apply --config="$cfg" --source="$PWD" \
                    --destination="$out" --exclude=scripts,externals \
                    --no-tty --force \
                    || { echo "::error::render failed: $tag pass $pass"; fail=1; }
                done

                diff -r "$RUNNER_TEMP/$tag-a" "$RUNNER_TEMP/$tag-b" \
                  || { echo "::error::non-deterministic render: $tag"; fail=1; }
              done
            done
          done
          exit $fail

      - name: shellcheck the rendered scripts
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          cfg="$RUNNER_TEMP/desktop-false-onedark.toml"
          for f in home/run_onchange_*.sh.tmpl; do
            rendered="$(chezmoi execute-template --config="$cfg" \
              --source="$PWD" < "$f")"
            [ -n "$rendered" ] || continue    # guarded off on this OS
            printf '%s\n' "$rendered" | shellcheck --shell=sh - \
              || { echo "::error file=$f::shellcheck failed"; exit 1; }
          done

      # The Unix scripts get shellcheck; the PowerShell side had nothing at all,
      # so a syntax error in the profile would only ever surface as a broken
      # shell on a real Windows box. Parsing is the PowerShell equivalent that
      # runs without executing anything.
      - name: parse the PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cfg = "$env:RUNNER_TEMP/desktop-false-onedark.toml"
          $fail = $false

          # Templates are rendered first; plain .ps1 files are parsed as-is.
          $sources = @{}
          foreach ($t in Get-ChildItem -Recurse -Filter '*.ps1.tmpl') {
            # No `<` redirection in PowerShell - the operator is reserved and
            # this is a parse error, not a runtime one. Pipe the file in.
            $rendered = Get-Content -Raw $t.FullName |
              chezmoi execute-template --config="$cfg" --source="$PWD" | Out-String
            if ($rendered.Trim()) { $sources[$t.FullName] = $rendered }
          }
          foreach ($p in @('bootstrap.ps1', 'home/dot_claude/statusline-command.ps1')) {
            $sources[$p] = Get-Content -Raw $p
          }

          foreach ($kv in $sources.GetEnumerator()) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseInput(
              $kv.Value, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              $fail = $true
              foreach ($e in $errors) {
                Write-Output "::error file=$($kv.Key)::$($e.Extent.StartLineNumber): $($e.Message)"
              }
            }
          }
          if ($fail) { exit 1 }

  apply:
    needs: render
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  role: headless, exclude: "" }
          - { os: macos-latest,   role: headless, exclude: "" }
          - { os: windows-latest, role: desktop,  exclude: "scripts" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: bootstrap
        if: runner.os != 'Windows'
        run: |
          chmod +x ./bootstrap.sh
          ./bootstrap.sh --source "$PWD" \
            --role ${{ matrix.role }} --no-work \
            --theme onedark --email ci@example.com \
            ${{ matrix.exclude && format('--exclude {0}', matrix.exclude) || '' }} \
            --yes

      - name: bootstrap
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./bootstrap.ps1 -Source $PWD `
            -Role ${{ matrix.role }} -NoWork `
            -Theme onedark -Email ci@example.com `
            -Exclude '${{ matrix.exclude }}' -Yes

      - name: apply again - the second run must be a no-op
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          args=(--source="$PWD" --no-tty --force)
          # `[ -n … ] && args+=…` here would abort under `set -e` on the two
          # matrix legs where exclude is empty.
          if [ -n "${{ matrix.exclude }}" ]; then
            args+=(--exclude="${{ matrix.exclude }}")
          fi

          # -v prints every change as a shell command, and prints the body of
          # any script it re-runs. Empty output is the strong assertion: no file
          # drifted AND no run_onchange re-triggered.
          out="$(chezmoi apply -v "${args[@]}")"
          if [ -n "$out" ]; then
            echo "::error::second apply was not a no-op"
            printf '%s\n' "$out"
            exit 1
          fi

          status="$(chezmoi status --source="$PWD")"
          if [ -n "$status" ]; then
            echo "::error::chezmoi status is not clean"
            printf '%s\n' "$status"
            exit 1
          fi

      # Everything above proves the files render and land correctly. Nothing
      # above ever *runs* them — which is how ~/.profile shipped sourcing two
      # filenames that had not existed since the sh/ files were numbered. The
      # rendered config was byte-perfect and completely inert.
      #
      # Login shells are the interesting case: ~/.profile is read by whatever
      # /bin/sh happens to be, so it must work under dash as well as bash, and
      # the tool integrations it pulls in only emit bash and zsh syntax.
      - name: shell startup smoke test
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -uo pipefail
          fail=0

          # Errors a broken rc file produces. `set -e` cannot be used to catch
          # these: a login shell reporting a missing include still exits 0 in
          # bash, so the assertion has to be on stderr, not on status.
          markers='No such file|not found|Syntax error|parse error|unexpected|cannot open'

          check() {   # $1 = label, rest = command to run
            local label="$1"; shift
            local out err st bad=0
            err="$RUNNER_TEMP/${label//[^a-zA-Z0-9]/_}.err"
            out="$("$@" 2>"$err")"; st=$?

            [ $st -eq 0 ] || { echo "::error::$label exited $st"; bad=1; }
            if grep -qE "$markers" "$err"; then
              echo "::error::$label wrote errors to stderr"; sed 's/^/    /' "$err"; bad=1
            fi
            case "$out" in
              *"EDITOR=nvim"*) ;;
              *) echo "::error::$label did not load ~/.config/sh/10-env.sh (got: $out)"; bad=1 ;;
            esac
            case "$out" in
              *"$HOME/.local/bin"*) ;;
              *) echo "::error::$label did not load ~/.config/sh/00-path.sh (got: $out)"; bad=1 ;;
            esac
            if [ $bad -eq 0 ]; then echo "ok: $label"; else fail=1; fi
          }

          probe='printf "EDITOR=%s PATH=%s" "${EDITOR:-}" "$PATH"'

          # POSIX login shells -> ~/.profile. dash is the one that matters most:
          # it is /bin/sh on Debian and it will not parse bash-only syntax.
          for sh in sh dash bash; do
            if command -v "$sh" >/dev/null 2>&1; then
              check "$sh -lc (.profile)" "$sh" -lc "$probe"
            else
              echo "skip: $sh not installed"
            fi
          done

          # Interactive zsh -> ~/.zshrc, the daily driver. Without a tty zsh
          # warns about zle on stderr; that is expected and not in $markers.
          if command -v zsh >/dev/null 2>&1; then
            check "zsh -ic (.zshrc)" zsh -ic "$probe"
          fi

          # ~/.bashrc hands off to zsh when one exists, so asserting on its
          # environment would just re-test zsh. Assert only that the handoff is
          # clean: start it, feed it EOF, expect a quiet exit.
          err="$RUNNER_TEMP/bashrc.err"
          if bash -i </dev/null >/dev/null 2>"$err"; then
            if grep -qE "$markers" "$err"; then
              echo "::error::.bashrc wrote errors to stderr"; sed 's/^/    /' "$err"; fail=1
            else
              echo "ok: bash -i (.bashrc handoff)"
            fi
          else
            echo "::error::bash -i exited $?"; sed 's/^/    /' "$err"; fail=1
          fi

          exit $fail
