name: ci

on:
  push:
    branches: [main, chezmoi-rewrite]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_ANALYTICS: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1
  # chezmoi keys --promptString by the prompt TEXT, not the data key. These
  # must match home/.chezmoi.toml.tmpl and bootstrap.sh verbatim.
  P_ROLE: "Machine role (desktop/headless)"
  P_THEME: "Colour scheme"
  P_EMAIL: "Git email"
  P_WORK: "Is this a work machine?"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # gitleaks needs history, not just the tip
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Templates are excluded: shellcheck cannot parse `{{`. They are linted
      # in `render`, after chezmoi has rendered them.
      - name: shellcheck
        run: |
          shellcheck --shell=sh \
            bootstrap.sh \
            home/dot_profile \
            home/dot_config/sh/00-path.sh \
            home/dot_config/sh/20-aliases.sh \
            home/dot_config/sh/30-tools.sh \
            home/dot_claude/executable_statusline-command.sh \
            home/dot_local/bin/executable_theme
          shellcheck --shell=bash \
            home/dot_bashrc \
            home/dot_local/bin/executable_tmux-sessionizer \
            home/dot_local/bin/executable_tmux-windowizer

  render:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: render every combination, twice
        run: |
          set -uo pipefail
          fail=0
          for role in desktop headless; do
            for work in true false; do
              for theme in onedark catppuccin-mocha dracula rose-pine; do
                tag="$role-$work-$theme"
                cfg="$RUNNER_TEMP/$tag.toml"

                # --config-path keeps every combination independent. Writing to
                # the real ~/.config/chezmoi/chezmoi.toml would poison the loop:
                # promptStringOnce reuses a value already present in the config,
                # so iteration 2 onward would silently re-render iteration 1.
                chezmoi init --config-path="$cfg" --source="$PWD" \
                  --no-tty --force \
                  --promptString "$P_ROLE=$role" \
                  --promptString "$P_THEME=$theme" \
                  --promptString "$P_EMAIL=ci@example.com" \
                  --promptBool "$P_WORK=$work" \
                  || { echo "::error::init failed: $tag"; fail=1; continue; }

                for pass in a b; do
                  out="$RUNNER_TEMP/$tag-$pass"; mkdir -p "$out"
                  chezmoi apply --config="$cfg" --source="$PWD" \
                    --destination="$out" --exclude=scripts,externals \
                    --no-tty --force \
                    || { echo "::error::render failed: $tag pass $pass"; fail=1; }
                done

                diff -r "$RUNNER_TEMP/$tag-a" "$RUNNER_TEMP/$tag-b" \
                  || { echo "::error::non-deterministic render: $tag"; fail=1; }
              done
            done
          done
          exit $fail

      - name: shellcheck the rendered scripts
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          cfg="$RUNNER_TEMP/desktop-false-onedark.toml"
          for f in home/run_onchange_*.sh.tmpl; do
            rendered="$(chezmoi execute-template --config="$cfg" \
              --source="$PWD" < "$f")"
            [ -n "$rendered" ] || continue    # guarded off on this OS
            printf '%s\n' "$rendered" | shellcheck --shell=sh - \
              || { echo "::error file=$f::shellcheck failed"; exit 1; }
          done

  apply:
    needs: render
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  role: headless, exclude: "" }
          - { os: macos-latest,   role: headless, exclude: "" }
          - { os: windows-latest, role: desktop,  exclude: "scripts" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: bootstrap
        if: runner.os != 'Windows'
        run: |
          chmod +x ./bootstrap.sh
          ./bootstrap.sh --source "$PWD" \
            --role ${{ matrix.role }} --no-work \
            --theme onedark --email ci@example.com \
            ${{ matrix.exclude && format('--exclude {0}', matrix.exclude) || '' }} \
            --yes

      - name: bootstrap
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./bootstrap.ps1 -Source $PWD `
            -Role ${{ matrix.role }} -NoWork `
            -Theme onedark -Email ci@example.com `
            -Exclude '${{ matrix.exclude }}' -Yes

      - name: apply again - the second run must be a no-op
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          args=(--source="$PWD" --no-tty --force)
          # `[ -n … ] && args+=…` here would abort under `set -e` on the two
          # matrix legs where exclude is empty.
          if [ -n "${{ matrix.exclude }}" ]; then
            args+=(--exclude="${{ matrix.exclude }}")
          fi

          # -v prints every change as a shell command, and prints the body of
          # any script it re-runs. Empty output is the strong assertion: no file
          # drifted AND no run_onchange re-triggered.
          out="$(chezmoi apply -v "${args[@]}")"
          if [ -n "$out" ]; then
            echo "::error::second apply was not a no-op"
            printf '%s\n' "$out"
            exit 1
          fi

          status="$(chezmoi status --source="$PWD")"
          if [ -n "$status" ]; then
            echo "::error::chezmoi status is not clean"
            printf '%s\n' "$status"
            exit 1
          fi
