unbind %
unbind '"'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Truecolor
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-features ",wezterm*:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",alacritty:RGB"

set -g detach-on-destroy off
set -g mouse on
set -g focus-events on
set -g escape-time 0
set -g base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g allow-rename off

# Catppuccin: @-options must be set before the plugin loads, everything else after
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "none"
run-shell "$HOME/.config/tmux/plugins/catppuccin/catppuccin.tmux"

set -g status-position bottom
set -g status-left-length 0
set -g status-right-length 64
set -g status-left ""
set -g status-right "#(echo #{pane_current_path} | sed \"s|^$HOME|~|\") "

setw -gF window-status-format "#[fg=#{@thm_overlay_0}] ##I"
setw -gF window-status-current-format "#[fg=#{@thm_blue}] ##I"
setw -g window-status-separator ""

setw -g mode-keys vi

# Copy mode entry
bind Escape copy-mode
bind -T prefix Escape copy-mode

# Copy mode navigation
bind -T copy-mode-vi j send-keys -X scroll-down
bind -T copy-mode-vi k send-keys -X scroll-up
bind -T copy-mode-vi C-u send-keys -X half-page-up
bind -T copy-mode-vi C-d send-keys -X half-page-down
bind -T copy-mode-vi C-f send-keys -X page-down
bind -T copy-mode-vi C-b send-keys -X page-up
bind -T copy-mode-vi g send-keys -X history-top
bind -T copy-mode-vi G send-keys -X history-bottom
bind -T copy-mode-vi w send-keys -X next-word
bind -T copy-mode-vi b send-keys -X previous-word
bind -T copy-mode-vi / send-keys -X search-forward
bind -T copy-mode-vi ? send-keys -X search-reverse
bind -T copy-mode-vi n send-keys -X search-again
bind -T copy-mode-vi N send-keys -X search-reverse

# Copy/paste actions
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi q send-keys -X cancel

bind z resize-pane -Z
bind c new-window -c "#{pane_current_path}"
bind f popup -w 80% -h 25% -x C -y C -E "$HOME/.local/bin/tmux-sessionizer"
bind b popup -w 80% -h 25% -x C -y C -E "$HOME/.local/bin/tmux-worktrees"
bind @ popup -w 100% -h 40% -x C -y 9999 -E "$HOME/.config/tmux/tmux-file-picker.sh"
bind r source-file ~/.tmux.conf \; display-message "Reloaded tmux config"
bind m display-menu -x C -y C -T "workmux" \
    "add" a "popup -d '#{pane_current_path}' -w 80% -h 20% -x C -y C -E '~/.config/tmux/workmux-add-branch.sh'" \
    "add w/branch" b "popup -d '#{pane_current_path}' -w 80% -h 25% -x C -y C -E '~/.config/tmux/workmux-add-from-branch.sh'" \
    "add w/prompt" p "popup -d '#{pane_current_path}' -w 80% -h 20% -x C -y C -E '~/.config/tmux/workmux-add-prompt.sh'" \
    "open" o "popup -d '#{pane_current_path}' -w 80% -h 25% -x C -y C -E '~/.config/tmux/workmux-fzf.sh open'" \
    "remove" r "popup -d '#{pane_current_path}' -w 80% -h 25% -x C -y C -E '~/.config/tmux/workmux-fzf.sh remove'" \
    "close" c "popup -d '#{pane_current_path}' -w 80% -h 25% -x C -y C -E '~/.config/tmux/workmux-fzf.sh close'" \
    "dashboard" d "popup -d '#{pane_current_path}' -w 90% -h 90% -x C -y C -E 'workmux dashboard'" \
    "sidebar" s "run-shell 'workmux sidebar'" \
    "quit" q ""
bind g popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit"
bind G popup -d "#{pane_current_path}" -w 90% -h 90% -E "gh dash"

# vim-aware pane navigation: C-h/j/k/l move panes, or pass through to vim
run-shell "$HOME/.config/tmux/vim-tmux-navigator.tmux"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
