unbind C-b
unbind %
unbind '"'
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
set -g focus-events on
set -g escape-time 0
set -g base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g allow-rename off
set -g allow-set-title off

set -g status-position bottom
# set -g status-style "bg=#090B10"
set -g status-left-length 0
set -g status-right-length 64
set -g status-left ""
# set -g status-right "#[fg=#908caa]#(echo #{pane_current_path} | sed \"s|^$HOME|~|\") "
set -g status-right "#(echo #{pane_current_path} | sed \"s|^$HOME|~|\") "

# setw -g window-status-format "#[fg=#6e6a86] #I"
setw -g window-status-format " #I"
# setw -g window-status-current-format "#[fg=#e0def4] #I"
setw -g window-status-current-format " #I"
setw -g window-status-separator ""

# VI
setw -g mode-keys vi

# Copy mode
bind Escape copy-mode
bind -T prefix Escape copy-mode

bind c new-window -c "#{pane_current_path}"
bind f popup -w 80% -h 25% -x C -y C -E "$HOME/.local/bin/tmux-sessionizer"
bind r source-file ~/.tmux.conf
bind z resize-pane -Z
bind w display-menu -x C -y C -T "workmux" \
    "add" a "popup -d '#{pane_current_path}' -w 80% -h 20% -x C -y C -E '~/.config/tmux/workmux-add-branch.sh'" \
    "add w/branch" b "popup -d '#{pane_current_path}' -w 80% -h 25% -x C -y C -E '~/.config/tmux/workmux-add-from-branch.sh'" \
    "add w/prompt" p "popup -d '#{pane_current_path}' -w 80% -h 20% -x C -y C -E '~/.config/tmux/workmux-add-prompt.sh'" \
    "open" o "popup -d '#{pane_current_path}' -w 80% -h 25% -x C -y C -E '~/.config/tmux/workmux-fzf.sh open'" \
    "remove" r "popup -d '#{pane_current_path}' -w 80% -h 25% -x C -y C -E '~/.config/tmux/workmux-fzf.sh remove'" \
    "close" c "popup -d '#{pane_current_path}' -w 80% -h 25% -x C -y C -E '~/.config/tmux/workmux-fzf.sh close'" \
    "dashboard" d "popup -d '#{pane_current_path}' -w 90% -h 90% -x C -y C -E 'workmux dashboard'" \
    "sidebar" s "run-shell 'workmux sidebar'" \
    "quit" q ""
bind g popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit"

# Splits (matching neovim's prefix + v / prefix + h)
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

# Pane navigation (uppercase to not clash with splits)
bind H select-pane -L
bind J select-pane -D
bind K select-pane -U
bind L select-pane -R
