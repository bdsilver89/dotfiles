packages:
  core:
    - git
    - git-delta
    - tmux
    - fzf
    - ripgrep
    - fd
    - bat
    - eza
    - zoxide
    - jq
    - zsh
    - gh

  mise:
    - neovim
    - starship
    - lazygit
    - workmux
    - herdr

  # eza isn't packaged for RHEL/EPEL (rebuilds like Rocky/Alma included), so
  # the rhel package script skips it in core and it's installed via mise
  # instead — see mise/config.toml.tmpl.
  rhel_mise_extra:
    - eza

  vendor:
    - name: claude-code
      command: claude
      url: https://claude.ai/install.sh
      args: ""

  zsh_plugins:
    - name: zsh-autosuggestions
      url: https://github.com/zsh-users/zsh-autosuggestions.git
    - name: zsh-syntax-highlighting
      url: https://github.com/zsh-users/zsh-syntax-highlighting.git

  apt_names:
    fd: fd-find

  dnf_names:
    fd: fd-find

  desktop:
    darwin:
      casks:
        - wezterm
        - visual-studio-code
        - zed
    linux:
      apt: []
      dnf: []
    windows:
      winget:
        - wez.wezterm
        - Microsoft.VisualStudioCode
        - ZedIndustries.Zed

  gh_extensions:
    - dlvhdr/gh-dash
    - dlvhdr/gh-enhance
    - github/gh-stack

  mise_runtimes:
    - node@lts
    - python@3.14
    - rust@stable
