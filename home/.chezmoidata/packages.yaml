packages:
  core:
    - git
    - git-delta
    - tmux
    - fzf
    - ripgrep
    - fd
    - bat
    - eza
    - zoxide
    - jq
    - zsh
    - gh

  mise:
    - neovim
    - starship
    - lazygit
    - workmux

  vendor:
    - name: claude-code
      command: claude
      url: https://claude.ai/install.sh
      args: ""

  apt_names:
    fd: fd-find

  dnf_names:
    fd: fd-find

  desktop:
    darwin:
      casks:
        - wezterm
        - visual-studio-code
        - zed
    linux:
      apt: []
      dnf: []
    windows:
      winget:
        - wez.wezterm
        - Microsoft.VisualStudioCode
        - ZedIndustries.Zed

  gh_extensions:
    - dlvhdr/gh-dash
    - dlvhdr/gh-enhance
    - github/gh-stack

  mise_runtimes:
    - node@lts
    - python@3.14
    - rust@stable
