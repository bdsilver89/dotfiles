packages:
  core:
    - git
    - tmux
    - fzf
    - ripgrep
    - fd
    - bat
    - eza
    - zoxide
    - jq
    - zsh
    - gh

  # In Homebrew, but apt/dnf either lack these or ship versions too old.
  # Installed via mise on Linux, via brew on macOS.
  unpackaged:
    - neovim
    - starship
    - lazygit

  extra:
    - mise
    - workmux
    - opencode
    - claude-code

  desktop:
    darwin:
      casks: [wezterm, visual-studio-code, zed]
    linux:
      apt: [wezterm]
    windows:
      winget: [wez.wezterm, Microsoft.VisualStudioCode, Zed.Zed]

  apt_names:
    fd: fd-find
    bat: batcat
    eza: eza

  vscode_extensions:
    - vscodevim.vim
    - ms-vscode-remote.remote-ssh

  mise:
    - node@lts
    - python@3.14
    - rust@stable
