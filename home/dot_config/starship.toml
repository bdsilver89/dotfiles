# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

# Replace the '❯' symbol in the prompt with '➜'
[character] # The name of the module we are configuring is 'character'
success_symbol = '[➜](bold green)' # The 'success_symbol' segment is being set to '➜' with the color 'bold green'

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

# Always show the Claude Code context percentage, regardless of usage level.
# Also show session input/output tokens and this turn's cache read tokens
# (cache hits are what keep a turn cheap/fast, worth seeing at a glance).
[claude_context]
format = '[$gauge $percentage \($input_tokens in/$output_tokens out, $curr_cache_read_tokens cache\)]($style) '
display = [{ threshold = 0.0, style = "bold green", hidden = false }]
