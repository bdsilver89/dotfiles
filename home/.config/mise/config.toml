# Global mise tools. `mise use -g` writes here through the symlink, so anything
# it adds shows up as a normal diff in this repo.
#
# Machine-local additions go in ~/.config/mise/conf.d/*.toml, which mise merges
# with this file and which is not tracked.
[tools]
neovim = "nightly"
starship = "latest"
lazygit = "latest"
workmux = "latest"

# Fedora/RHEL override CLI tools with "system" in conf.d/00-platform.toml
# when dnf supplies them; missing packages fall back to mise.
fd = "latest"
gh = "latest"

node = "lts"
python = "3.14"
rust = "stable"
lazydocker = "latest"
pnpm = "latest"

opencode = "latest"
codex = "latest"
claude-code = "latest"
