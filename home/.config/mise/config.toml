[settings]
lockfile = true
lockfile_mode = "generate"

[tools]
# Tools
direnv = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
herdr = "latest"
jq = "latest"
lazydocker = "latest"
lazygit = "latest"
neovim = "nightly"
ripgrep = "latest"
starship = "latest"
tree-sitter = "latest"
"github:agavra/tuicr" = "latest"
zoxide = "latest"

# Package managers
uv = "latest"

# Languages
go = "latest"
java = "temurin-25"
node = "lts"
python = "3.14"
rust = "stable"

# Build tools
cmake = "latest"
terraform = "latest"
gradle = "latest"
maven = "latest"
ninja = "latest"

# LSP
lua-language-server = "latest"
stylua = "latest"
"vfox:tinnet/vfox-jdtls" = "1.63.0"
"npm:bash-language-server" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:yaml-language-server" = "latest"
"github:redhat-developer/vscode-xml" = { version = "latest", asset_pattern = 'lemminx-{{ os(macos="osx") }}-{{ arch(x64="x86_64", arm64="aarch_64") }}.zip', rename_exe = "lemminx" }
"cargo:neocmakelsp" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"pypi:basedpyright" = "latest"
"pypi:ruff" = "latest"
"npm:typescript" = "latest"
terraform-ls = "latest"
tflint = "latest"

# Debug adapters
"pypi:debugpy" = "latest"
"go:github.com/go-delve/delve/cmd/dlv" = "latest"
"github:vadimcn/codelldb" = { version = "latest", matching_regex = "^codelldb-(darwin|linux)-", format = "zip", bin_path = "extension/adapter" }
"github:microsoft/vscode-js-debug" = { version = "latest", asset_pattern = "js-debug-dap-*.tar.gz", strip_components = 1 }
"http:java-debug" = { version = "0.53.1", url = "https://repo.maven.apache.org/maven2/com/microsoft/java/com.microsoft.java.debug.plugin/{{ version }}/com.microsoft.java.debug.plugin-{{ version }}.jar", format = "raw", bin = "java-debug.jar" }

# AI
claude-code = "latest"
codex = "latest"
opencode = "latest"
pi = "latest"

"pypi:graphifyy" = "latest"
"npm:openwiki" = { version = "latest", allow_builds = ["better-sqlite3"] }

[bootstrap.packages]
"brew:git" = { os = "macos" }
"brew-cask:discord" = { version = "latest", os = "macos" }
"brew-cask:docker-desktop" = { version = "latest", os = "macos" }
"brew-cask:ghostty" = { version = "latest", os = "macos" }
"brew-cask:linear" = { version = "latest", os = "macos" }
"brew-cask:google-chrome" = { version = "latest", os = "macos" }
"brew-cask:herdr-app" = { version = "latest", os = "macos" }

"brew-cask:font-jetbrains-mono-nerd-font" = { version = "latest", os = "macos" }

# Native build/runtime deps for the toolchain above (compiler for cargo/tree-sitter/node-gyp)
"apt:build-essential"    = { os = "linux" }
"apt:git"                = { os = "linux" }
"apt:curl"               = { os = "linux" }
"apt:unzip"              = { os = "linux" }
"apt:xz-utils"           = { os = "linux" }
"apt:ca-certificates"    = { os = "linux" }
"apt:pkg-config"         = { os = "linux" }

"dnf:gcc"                = { os = "linux" }
"dnf:gcc-c++"            = { os = "linux" }
"dnf:make"               = { os = "linux" }
"dnf:git"                = { os = "linux" }
"dnf:curl"               = { os = "linux" }
"dnf:unzip"              = { os = "linux" }
"dnf:xz"                 = { os = "linux" }
"dnf:ca-certificates"    = { os = "linux" }
"dnf:pkgconf-pkg-config" = { os = "linux" }

"winget:Git.Git" = "latest"
"winget:Microsoft.PowerToys" = "latest"
