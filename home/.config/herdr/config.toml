onboarding = false
[update]
version_check = false

[terminal]
new_cwd = "follow"

[session]
resume_agents_on_restore = true

[keys]
prefix = "ctrl+a"
goto = "prefix+f"
open_worktree = "prefix+shift+o"

focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"
